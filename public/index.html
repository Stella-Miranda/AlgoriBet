<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AlgoriBet</title>
  <meta name="description" content="Put points on algorithms. Six runners, one problem, ten seconds.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="masthead">
    <a class="wordmark" href="/" data-action="home">Algori<em>Bet</em></a>
    <p class="masthead-tag">The form guide for algorithms</p>
    <div class="masthead-room" id="masthead-room"></div>
  </header>

  <main id="app"></main>

  <div class="toast" id="toast" role="status" hidden></div>
  <div class="conn" id="conn" hidden>Lost the line to the course. Reconnecting…</div>

  <footer class="colophon">
    <span>AlgoriBet</span>
    <span>Points have no cash value. Please gamble on algorithms responsibly.</span>
  </footer>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
